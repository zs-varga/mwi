name: save-market-data

on:
  # Started every hour at XX:15 UTC by the Cloudflare Worker "mwi-cron" (it calls the workflow_dispatch API),
  # because GitHub's own schedule trigger has been unreliable.  You can also start it by hand.
  # Each run saves the snapshot if the data changed and re-uploads the database.
  workflow_dispatch:
    inputs:
      source:
        description: "who started this run (the Worker sends 'cloudflare')"
        required: false
        default: "manual"

run-name: "save-market-data (${{ inputs.source || 'manual' }})"

permissions:
  contents: write          # push snapshots, create/update the release
  pages: write             # publish the dashboard
  id-token: write          # needed by actions/deploy-pages

concurrency:
  group: market-data       # never let two runs overlap (they would race on the push and the upload)
  cancel-in-progress: false

env:
  RELEASE_TAG: market-history
  DB_ASSET: market.db.gz            # raw history (every change of every item): the permanent archive, not served on the site
  DASH_ASSET: dashboard.db.gz       # small database built from it for the dashboard (build_dashboard_db.py)

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download market data and save it if it changed
        run: |
          curl -sSfL -A "Mozilla/5.0" https://www.milkywayidle.com/game_data/marketplace.json -o m.json
          python3 - <<'PY'
          import glob, gzip, json, os, shutil

          new = json.load(open("m.json"))
          os.makedirs("snapshots", exist_ok=True)

          # compare the market data itself (not the timestamp) with the newest saved snapshot
          files = sorted(glob.glob("snapshots/marketplace_*.json.gz"))
          if files:
              last = json.load(gzip.open(files[-1]))
              if last["marketData"] == new["marketData"]:
                  print("market data unchanged since", files[-1], "- not saving")
                  raise SystemExit(0)

          dest = f"snapshots/marketplace_{new['timestamp']}.json.gz"
          if os.path.exists(dest):
              print(dest, "already exists - not saving")
              raise SystemExit(0)
          with open("m.json", "rb") as src, gzip.open(dest, "wb") as out:
              shutil.copyfileobj(src, out)
          print("saved", dest)
          PY
          rm m.json

      - name: Commit and push the snapshot
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add snapshots
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "market snapshot"
            git pull --rebase
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # Keep the history database (release asset) up to date: download it, import any snapshot it
      # does not have yet, upload it again.  Without an existing release it is built from all snapshots.
      # Then rebuild the dashboard database from it (always from scratch, so a change of the model needs no migration).
      - name: Update the history database
        if: steps.commit.outputs.committed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --pattern "$DB_ASSET" --clobber || echo "no database yet - building from scratch"
          if [ -f "$DB_ASSET" ]; then gunzip -f "$DB_ASSET"; fi
          python3 history_db.py --db market.db --snapshots snapshots
          python3 build_dashboard_db.py --src market.db --out dashboard.db
          gzip -9 -f market.db
          gzip -9 -f dashboard.db
          gh release view "$RELEASE_TAG" > /dev/null 2>&1 || gh release create "$RELEASE_TAG" \
            --title "Market history database" \
            --notes "market.db.gz: SQLite price history (delta format, see history_db.py). dashboard.db.gz: the small database the dashboard reads (build_dashboard_db.py). Both rebuilt hourly by the workflow."
          # GitHub's upload endpoint sometimes answers with a 5xx (e.g. 502); --clobber deletes the old asset first,
          # so a failed upload would leave the release without a database.  Retry a few times before giving up.
          upload() {
            for attempt in 1 2 3 4; do
              if gh release upload "$RELEASE_TAG" "$1" --clobber; then return 0; fi
              if [ "$attempt" = 4 ]; then echo "upload of $1 failed 4 times"; exit 1; fi
              echo "upload of $1 failed (attempt $attempt), retrying in $((attempt * 15)) s"
              sleep $((attempt * 15))
            done
          }
          upload "$DB_ASSET"
          upload "$DASH_ASSET"

  # Publish the dashboard (market_watch/index.html) together with the latest dashboard database to GitHub Pages,
  # so it can be watched at https://<user>.github.io/<repo>/ .  One-time setup: repo Settings > Pages >
  # Source = "GitHub Actions".
  pages:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy3.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          cp market_watch/index.html site/
          gh release download "$RELEASE_TAG" --pattern "$DASH_ASSET" --dir site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # GitHub Pages deployments fail now and then for reasons outside this repo ("Deployment failed, try again
      # later", or "No artifacts named github-pages were found" right after a successful upload).  Try up to 3
      # times, waiting between the attempts; the job only fails if all three fail.
      - id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before deploy retry 2
        if: steps.deploy1.outcome == 'failure'
        run: sleep 45

      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before deploy retry 3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90

      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
