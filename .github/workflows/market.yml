name: save-market-data

on:
  # Started every hour at XX:15 UTC by the Cloudflare Worker "mwi-cron" (it calls the workflow_dispatch API),
  # because GitHub's own schedule trigger has been unreliable.  You can also start it by hand.
  # Each run saves the snapshot if the data changed and re-uploads the database.
  workflow_dispatch:
    inputs:
      source:
        description: "who started this run (the Worker sends 'cloudflare')"
        required: false
        default: "manual"

run-name: "save-market-data (${{ inputs.source || 'manual' }})"

permissions:
  contents: write          # push snapshots, create/update the release

concurrency:
  group: market-data       # never let two runs overlap (they would race on the push and the upload)
  cancel-in-progress: false

env:
  RELEASE_TAG: market-history
  DB_ASSET: market.db.gz

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download market data and save it if it changed
        run: |
          curl -sSfL -A "Mozilla/5.0" https://www.milkywayidle.com/game_data/marketplace.json -o m.json
          python3 - <<'PY'
          import glob, gzip, json, os, shutil

          new = json.load(open("m.json"))
          os.makedirs("snapshots", exist_ok=True)

          # compare the market data itself (not the timestamp) with the newest saved snapshot
          files = sorted(glob.glob("snapshots/marketplace_*.json.gz"))
          if files:
              last = json.load(gzip.open(files[-1]))
              if last["marketData"] == new["marketData"]:
                  print("market data unchanged since", files[-1], "- not saving")
                  raise SystemExit(0)

          dest = f"snapshots/marketplace_{new['timestamp']}.json.gz"
          if os.path.exists(dest):
              print(dest, "already exists - not saving")
              raise SystemExit(0)
          with open("m.json", "rb") as src, gzip.open(dest, "wb") as out:
              shutil.copyfileobj(src, out)
          print("saved", dest)
          PY
          rm m.json

      - name: Commit and push the snapshot
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add snapshots
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "market snapshot"
            git pull --rebase
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # Keep the history database (release asset) up to date: download it, import any snapshot it
      # does not have yet, upload it again.  Without an existing release it is built from all snapshots.
      - name: Update the history database
        if: steps.commit.outputs.committed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --pattern "$DB_ASSET" --clobber || echo "no database yet - building from scratch"
          if [ -f "$DB_ASSET" ]; then gunzip -f "$DB_ASSET"; fi
          python3 history_db.py --db market.db --snapshots snapshots
          gzip -9 -f market.db
          gh release view "$RELEASE_TAG" > /dev/null 2>&1 || gh release create "$RELEASE_TAG" \
            --title "Market history database" \
            --notes "market.db.gz: SQLite price history (delta format, see history_db.py). Rebuilt hourly by the workflow."
          gh release upload "$RELEASE_TAG" "$DB_ASSET" --clobber
