<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Watch</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb;
  --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10); --wash: rgba(11,11,11,.05);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --up: #006300; --down: #d03b3b; --accent: #2a78d6;
  --buy: #008300; --sell: #e34948;
  --cost1: #8250df; --cost2: #b07d00;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.06);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --up: #0ca30c; --down: #d03b3b; --accent: #3987e5;
    --buy: #008300; --sell: #e66767;
    --cost1: #a98bf5; --cost2: #e3b341;
  }
}
:root[data-theme="dark"] {
  --cost1: #a98bf5; --cost2: #e3b341;
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.06);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --up: #0ca30c; --down: #d03b3b; --accent: #3987e5;
  --buy: #008300; --sell: #e66767;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
body { padding: 0 16px 48px; }
.wrap { max-width: 1180px; margin: 0 auto; }
header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; padding: 22px 0 8px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
.meta { color: var(--ink-2); font-size: 13px; flex: 1 1 200px; min-width: 0; }
button, select, input { font: inherit; color: var(--ink); }
.btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { background: var(--wash); }
.btn.on { background: var(--wash); border-color: var(--ink-2); font-weight: 600; }
.btn:focus-visible, select:focus-visible, input:focus-visible, th button:focus-visible, td button:focus-visible, svg:focus-visible
  { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--grid); margin: 8px 0 14px; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 14px; cursor: pointer; color: var(--ink-2); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.filters { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; margin-bottom: 12px; }
.filters label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink-2); }
.filters select, .filters input { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; min-width: 120px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--surface); border: 0; padding: 6px 12px; cursor: pointer; border-right: 1px solid var(--border); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--wash); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.summary { color: var(--ink-2); font-size: 13px; margin: 0 0 10px; }
.note { color: var(--ink-2); font-size: 13px; background: var(--wash); border-radius: 8px; padding: 8px 12px; margin: 0 0 12px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child, th:nth-child(2), td.name { text-align: left; }
th:first-child, td.star { width: 34px; padding-right: 0; }
th { font-weight: 600; font-size: 12px; color: var(--ink-2); position: sticky; top: 0; background: var(--surface); }
th button { background: none; border: 0; cursor: pointer; font: inherit; color: inherit; padding: 0; }
th[aria-sort] button { color: var(--ink); }
td.name button { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: var(--ink); font-weight: 500; }
td.name button:hover { text-decoration: underline; }
td.star button { background: none; border: 0; cursor: pointer; font-size: 16px; color: var(--muted); line-height: 1; }
td.star button[aria-pressed="true"] { color: var(--ink); }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--muted); }
.tablewrap { overflow-x: auto; max-height: 70vh; overflow-y: auto; }
.charthead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 0 0 6px; }
.charthead h3 { margin: 0; font-size: 14px; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); }
.hatch { display: inline-block; width: 14px; height: 10px; vertical-align: middle; margin-right: 6px; border-radius: 2px; border: 1px solid var(--axis);
  background: repeating-linear-gradient(45deg, var(--axis) 0 1px, transparent 1px 4px); }
.key { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; border-radius: 2px; }
.key.dotted { border-top: 0; height: 2px; background: repeating-linear-gradient(90deg, var(--k) 0 2px, transparent 2px 5px); }
.key.dashed { border-top: 0; height: 2px; background: repeating-linear-gradient(90deg, var(--k) 0 4px, transparent 4px 7px); }
.brush { margin: 0 0 14px; }
.brush svg { display: block; width: 100%; height: auto; touch-action: none; user-select: none; }
.brush .h { cursor: ew-resize; } .brush .h:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.brush .sel { cursor: grab; } .brush .sel:active { cursor: grabbing; }
.brushmeta { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.legend .lg { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; display: inline-flex; align-items: center; }
.legend .lg[aria-pressed="false"] { opacity: .4; text-decoration: line-through; }
.legend .lg:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.dotkey { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: middle; margin: 0 7px 0 2px; }
#skilltable th:first-child { width: auto; padding-right: 10px; }
#skilltable th, #skilltable td { text-align: left; }
#skilltable input { width: 110px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
#craft th:first-child, #trade th:first-child { width: auto; padding-right: 10px; }
#trade th:nth-child(2) { text-align: right; }
#craft th:nth-child(2) { text-align: right; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.14); z-index: 5; white-space: nowrap; display: none; }
.tip .t { color: var(--ink-2); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; }
.tip .r b { font-size: 13px; }
.tip .r span.n { color: var(--ink-2); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.wcard { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.wcard .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.wcard .nm { font-weight: 600; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.wcard .nm:hover { text-decoration: underline; }
.wcard .big { font-size: 22px; font-weight: 650; margin-top: 2px; }
.wcard .sub { font-size: 12px; color: var(--ink-2); }
.empty { padding: 36px 12px; text-align: center; color: var(--ink-2); }
.drop { border: 2px dashed var(--axis); border-radius: 12px; padding: 36px 20px; text-align: center; color: var(--ink-2); }
.drop.over { border-color: var(--accent); background: var(--wash); }
.nocomp { color: var(--s3); font-weight: 600; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (min-width: 641px) {
  header { flex-wrap: nowrap; align-items: center; }
  header .btn { white-space: nowrap; flex: none; }
}
@media (min-width: 641px) { /* eight controls in one row: compact boxes; below this width the row wraps */
  #i-filters { flex-wrap: nowrap; gap: 6px; }
  #i-filters label { flex: 0 0 auto; min-width: 0; width: 64px; }
  #i-filters label.grow { flex: 1 1 110px; width: auto; }
  #i-filters #i-level-l { width: 58px; }
  #i-filters #i-hour-l { width: 100px; }
  #i-filters select, #i-filters input { min-width: 0; width: 100%; padding: 6px; font-size: 13px; }
  #i-filters .btn { white-space: nowrap; flex: none; padding: 6px 8px; }
}
@media (max-width: 640px) { body { padding: 0 10px 40px; } .filters label { flex: 1 1 140px; } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Market Watch</h1>
  <div class="meta" id="meta">No data loaded.</div>
  <button class="btn" id="open">Open data file…</button>
  <button class="btn" id="theme" title="Switch between automatic, light and dark">Theme: auto</button>
  <input type="file" id="file" accept=".db,.gz,.sqlite" class="hidden">
</header>

<div id="load" class="drop">
  <p><strong>Load the market history database</strong></p>
  <p>Drop <code>market.db.gz</code> (or <code>market.db</code>) here, or use “Open data file…”.<br>
  If this page is served from the folder that holds the file, it loads automatically.</p>
  <p id="loaderr" style="color:var(--down)"></p>
</div>

<main id="app" class="hidden">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-movers" aria-selected="true">Movers</button>
    <button class="tab" role="tab" id="tab-item" aria-selected="false">Item</button>
    <button class="tab" role="tab" id="tab-craft" aria-selected="false">Crafting</button>
    <button class="tab" role="tab" id="tab-trade" aria-selected="false">Trade</button>
    <button class="tab" role="tab" id="tab-watch" aria-selected="false">Watchlist</button>
    <button class="tab" role="tab" id="tab-settings" aria-selected="false">Settings</button>
  </div>

  <div class="filters" id="filters">
    <label>Compare with
      <select id="f-window">
        <option value="prev">previous snapshot</option>
        <option value="6h">6 hours ago</option>
        <option value="24h" selected>24 hours ago</option>
        <option value="7d">7 days ago</option>
      </select></label>
    <label>Enhancement level <select id="f-level"></select></label>
    <label id="f-minvol-l">Min volume per hour <input id="f-minvol" type="number" min="0" step="10" value="100"></label>
    <label id="f-search-l">Search <input id="f-search" type="search" placeholder="item name"></label>
    <div id="f-dir-l"><div style="font-size:12px;color:var(--ink-2);margin-bottom:3px">Direction</div>
      <div class="seg" role="group" aria-label="Direction">
        <button data-dir="all" aria-pressed="true">All</button>
        <button data-dir="up" aria-pressed="false">Up</button>
        <button data-dir="down" aria-pressed="false">Down</button>
      </div></div>
  </div>
  <div id="windownote"></div>

  <section id="p-movers">
    <p class="summary" id="summary"></p>
    <div class="card"><div class="tablewrap"><table id="movers"><thead></thead><tbody></tbody></table></div>
      <p class="summary" id="more" style="margin:10px 0 0"></p></div>
  </section>

  <section id="p-item" class="hidden">
    <div class="filters" id="i-filters">
      <label class="grow">Item <input id="i-search" list="itemlist" placeholder="type an item name" autocomplete="off"></label>
      <datalist id="itemlist"></datalist>
      <label id="i-level-l">Level <select id="i-level"></select></label>
      <label id="i-hour-l" class="hidden" title="Crafting time (real hours, with your speed and efficiency) is added to the cost lines at this price, in millions of coins per hour. Not saved.">Hour value (M) <input id="i-hour" type="number" min="0" step="0.05" value="0"></label>
      <button class="btn" id="i-star" aria-pressed="false">☆ Watch</button>
    </div>
    <div id="i-brush" class="brush"></div>
    <div id="item-body"><div class="empty">Pick an item above, or click one in Movers.</div></div>
  </section>

  <section id="p-craft" class="hidden">
    <div class="filters" id="c-filters">
      <label title="Crafting time (real hours) is added to the cost at this price, in millions of coins per hour. Shared with the Item tab. Not saved.">Hour value (M) <input id="c-hour" type="number" min="0" step="0.05" value="0"></label>
      <div><div style="font-size:12px;color:var(--ink-2);margin-bottom:3px">Craft</div>
        <div class="seg" role="group" aria-label="Craft" id="c-mode">
          <button data-m="1" aria-pressed="true" title="Buy the direct ingredients, craft the last step">1 step</button>
          <button data-m="f" aria-pressed="false" title="Craft every step from base materials">Full</button>
        </div></div>
      <label title="Only items that traded at least this many units in the last hour">Min units/h <input id="c-minvol" type="number" min="0" step="1" value="5"></label>
      <label>Search <input id="c-search" type="search" placeholder="item name"></label>
      <div><div style="font-size:12px;color:var(--ink-2);margin-bottom:3px">Show</div>
        <div class="seg" role="group" aria-label="Show" id="c-only">
          <button data-o="1" aria-pressed="true">Profitable</button>
          <button data-o="0" aria-pressed="false">All</button>
        </div></div>
    </div>
    <p class="summary" id="c-summary"></p>
    <div class="card"><div class="tablewrap"><table id="craft"><thead></thead><tbody></tbody></table></div></div>
  </section>

  <section id="p-trade" class="hidden">
    <div id="t-note"></div>
    <p class="summary" id="t-summary"></p>
    <div class="card"><div class="tablewrap"><table id="trade"><thead></thead><tbody></tbody></table></div></div>
  </section>

  <section id="p-watch" class="hidden">
    <div id="watch-body"></div>
  </section>

  <section id="p-settings" class="hidden">
    <div class="card"><div class="tablewrap"><table id="skilltable"><thead></thead><tbody></tbody></table></div></div>
    <p class="summary"><label>Drink duration (s) <input id="drink-secs" type="number" min="1" step="1" style="width:90px"></label></p>
    <div class="card"><div class="tablewrap"><table id="drinktable"><thead></thead><tbody></tbody></table></div></div>
  </section>
</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
<script>
"use strict";
// ------------------------------------------------------------------ helpers
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const c of kids) if (c != null) n.append(c);
  return n;
};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};
const pretty = (hrid) => hrid.split("/").pop().split("_").map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
const fmt = (n) => {
  if (n == null) return "—";
  const a = Math.abs(n);
  if (a >= 1e9) return (n / 1e9).toFixed(2).replace(/\.?0+$/, "") + "B";
  if (a >= 1e7) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (a >= 1e5) return (n / 1e3).toFixed(0) + "K";
  return Math.round(n).toLocaleString("en-US");
};
const fmtDur = (t) => (t < 90 ? Math.round(t) + " s" : t < 5400 ? Math.round(t / 60) + " min" : (t / 3600).toFixed(1) + " h"); // seconds as s, min or h
const full = (n) => (n == null ? "—" : Math.round(n).toLocaleString("en-US"));
const pct = (a, b) => (a == null || b == null || b === 0 ? null : ((a - b) / b) * 100);
const dtf = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
const dtShort = new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit" });
const dtDay = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" });
const when = (ts) => dtf.format(new Date(ts * 1000));
const ago = (secs) => {
  if (secs < 5400) return Math.round(secs / 60) + " min";
  if (secs < 172800) return (secs / 3600).toFixed(secs < 36000 ? 1 : 0).replace(/\.0$/, "") + " h";
  return (secs / 86400).toFixed(1).replace(/\.0$/, "") + " d";
};
const bidOrNull = (v) => (v == null || v < 0 ? null : v); // -1 = no order

// Volume swings are huge when the earlier hour had almost nothing, so: "new" when nothing traded before,
// "no trades" when nothing trades now, a multiple (x3.4) from 3x up, "x100+" beyond that, and a percentage otherwise.  Exact figure in the tooltip.
function volDeltaNode(r) {
  if (r.volNew) return el("span", { class: "up", text: "▲ new", title: "traded now, no trades in the earlier hour" });
  if (r.volGone) return el("span", { class: "down", text: "▼ no trades", title: "no trades now, traded in the earlier hour" });
  const p = r.dVol;
  if (p == null) return el("span", { class: "flat", text: "—" });
  if (p >= 200) {
    const x = 1 + p / 100;
    return el("span", { class: "up", text: x >= 100 ? "▲ ×100+" : "▲ ×" + (x >= 10 ? Math.round(x) : x.toFixed(1)), title: "+" + Math.round(p).toLocaleString("en-US") + "%" });
  }
  return deltaNode(p);
}
function deltaNode(p) {
  if (p == null) return el("span", { class: "flat", text: "—" });
  if (Math.abs(p) < 0.005) return el("span", { class: "flat", text: "— 0%" });
  const up = p > 0;
  return el("span", { class: up ? "up" : "down", text: (up ? "▲ " : "▼ ") + Math.abs(p).toFixed(Math.abs(p) < 10 ? 1 : 0) + "%" });
}

// ------------------------------------------------------------------ data layer
let SQL = null, db = null;
const D = { snaps: [], items: new Map(), byName: new Map(), levels: [], names: [], latest: null };

function rows(sql, params = []) {
  const st = db.prepare(sql); st.bind(params);
  const out = [];
  while (st.step()) out.push(st.get());
  st.free();
  return out;
}

async function openDb(bytes) {
  if (!SQL) SQL = await initSqlJs({ locateFile: (f) => "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/" + f });
  if (db) db.close();
  db = new SQL.Database(new Uint8Array(bytes));
  D.snaps = rows("SELECT snapshot_id, ts FROM snapshot ORDER BY ts").map(([id, ts]) => ({ id, ts }));
  if (!D.snaps.length) throw new Error("The database has no snapshots.");
  D.items = new Map(rows("SELECT item_id, hrid FROM item").map(([id, h]) => [id, { id, hrid: h, name: pretty(h) }]));
  D.byName = new Map([...D.items.values()].map((i) => [i.name, i]));
  D.levels = rows("SELECT DISTINCT level FROM obs ORDER BY level").map((r) => r[0]);
  D.latest = D.snaps[D.snaps.length - 1];
  stateCache.clear(); histCache.clear(); costCache.clear(); hasDepth = null; craftSet = null; craftSecs = null; recipes = null; dropTab = null; lootTab = null; drinkTab = null;
}

const stateCache = new Map();
function stateAt(snapId) { // Map "item|level" -> {ask,bid,price,volume}; unlisted items are absent
  if (stateCache.has(snapId)) return stateCache.get(snapId);
  const m = new Map();
  const st = db.prepare(`SELECT o.item_id, o.level, o.ask, o.bid, o.price, o.volume FROM obs o
    WHERE o.snapshot_id = (SELECT MAX(z.snapshot_id) FROM obs z WHERE z.item_id = o.item_id AND z.level = o.level AND z.snapshot_id <= ?)`);
  st.bind([snapId]);
  while (st.step()) {
    const [i, l, ask, bid, price, volume] = st.get();
    if (ask == null && bid == null && price == null && volume == null) continue; // end marker
    m.set(i + "|" + l, { ask: bidOrNull(ask), bid: bidOrNull(bid), price, volume });
  }
  st.free();
  stateCache.set(snapId, m);
  return m;
}

const histCache = new Map();
let hasDepth = null, craftSet = null, craftSecs = null, recipes = null, dropTab = null, lootTab = null, drinkTab = null; const costCache = new Map(); // item_recipe (one level) and the cost series computed from it; the cache key includes the artisan value
function history(itemId, level) { // one point per snapshot, values carried forward; null = not listed
  const key = itemId + "|" + level;
  if (histCache.has(key)) return histCache.get(key);
  const r = rows("SELECT snapshot_id, ask, bid, price, volume FROM obs WHERE item_id = ? AND level = ? ORDER BY snapshot_id", [itemId, level]);
  const pts = []; let k = 0, cur = null;
  for (const s of D.snaps) {
    while (k < r.length && r[k][0] <= s.id) {
      const [, ask, bid, price, volume] = r[k++];
      cur = (ask == null && bid == null && price == null && volume == null) ? null : { ask: bidOrNull(ask), bid: bidOrNull(bid), price, volume };
    }
    pts.push({ ts: s.ts, v: cur });
  }
  histCache.set(key, pts);
  return pts;
}

function pickThen(windowId) {
  const L = D.latest, idx = D.snaps.length - 1;
  if (idx === 0) return { snap: null, note: "Only one snapshot so far – nothing to compare with yet." };
  if (windowId === "prev") return { snap: D.snaps[idx - 1], note: "" };
  const secs = { "6h": 6 * 3600, "24h": 24 * 3600, "7d": 7 * 86400 }[windowId];
  const target = L.ts - secs;
  let best = null;
  for (const s of D.snaps) if (s.ts <= target) best = s;
  if (best) return { snap: best, note: "" };
  const first = D.snaps[0];
  return { snap: idx > 0 ? first : null,
    note: `Only ${ago(L.ts - first.ts)} of history so far, so “${windowId}” compares with the oldest snapshot (${when(first.ts)}).` };
}

// ------------------------------------------------------------------ movers
function moversData() {
  const nowS = stateAt(D.latest.id), t = pickThen(UI.windowId);
  const thenS = t.snap ? stateAt(t.snap.id) : new Map();
  const out = [];
  for (const [key, n] of nowS) {
    const [iid, lvl] = key.split("|").map(Number);
    if (lvl !== UI.level) continue;
    const it = D.items.get(iid);
    if (UI.search && !it.name.toLowerCase().includes(UI.search.toLowerCase())) continue;
    if ((n.volume || 0) < UI.minvol) continue;
    const o = thenS.get(key) || null;
    const dBid = o ? pct(n.bid, o.bid) : null, dAsk = o ? pct(n.ask, o.ask) : null;
    const nowV = n.volume > 0, thenV = o && o.volume > 0;
    const volNew = !!t.snap && nowV && !thenV, volGone = !!t.snap && !nowV && thenV;   // traded now but not then / the other way round
    const dVol = nowV && thenV ? pct(n.volume, o.volume) : null;
    const dVolS = volNew ? 1e9 : volGone ? -100 : dVol;                                 // sort key: "new" first, "no trades" last
    const spread = n.ask != null && n.bid != null && n.bid > 0 ? ((n.ask - n.bid) / n.bid) * 100 : null;
    const move = dBid != null ? dBid : dAsk;
    if (UI.dir === "up" && !(move > 0.005)) continue;
    if (UI.dir === "down" && !(move < -0.005)) continue;
    out.push({ key, iid, lvl, name: it.name, n, bid: n.bid, ask: n.ask, vol: n.volume, dBid, dAsk, dVol, dVolS, volNew, volGone, spread, abs: move == null ? -1 : Math.abs(move), move });
  }
  return { list: out, t };
}

    return (typeof x === "string" ? x.localeCompare(y) : x - y) * s.dir;

    const row = el("tr");

    star.addEventListener("click", () => { toggleWatch(r.key); star.setAttribute("aria-pressed", String(UI.watch.has(r.key))); star.textContent = UI.watch.has(r.key) ? "★" : "☆"; });
    row.append(el("td", { class: "star" }, star));
    const nm = el("button", { text: r.name }); nm.addEventListener("click", () => openItem(r.iid, r.lvl));
    row.append(el("td", { class: "name" }, nm));
    row.append(el("td", { text: full(r.bid) }), el("td", {}, deltaNode(r.dBid)),
      el("td", { text: full(r.ask) }), el("td", {}, deltaNode(r.dAsk)),
      el("td", { text: r.spread == null ? "—" : r.spread.toFixed(1) + "%" }),
      el("td", { text: full(r.vol) }), el("td", {}, volDeltaNode(r)));
    tb.append(row);
  }
  const more = $("more");
  more.replaceChildren();
  if (list.length > UI.limit) {
    more.append(`Showing the first ${UI.limit} of ${list.length}. `);
    more.append(el("button", { class: "btn", text: "Show all", onclick: () => { UI.limit = 1e9; renderMovers(); } }));
  }
  if (!list.length) tb.append(el("tr", {}, el("td", { colspan: "9", class: "empty", text: "No items match these filters." })));

// ------------------------------------------------------------------ time chart (SVG, no dependencies)
function niceTicks(min, max, n = 4) {
  if (min === max) { min -= 1; max += 1; }
  const raw = (max - min) / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
  for (let v = lo; v <= hi + step / 2; v += step) ticks.push(v);
  return { lo, hi, ticks };

const SVGNS = "http://www.w3.org/2000/svg";
const sv = (tag, attrs = {}) => { const n = document.createElementNS(SVGNS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); return n; };


// Volume is shown on the average-price line itself: thicker and more saturated = more units traded that hour.
const hex2rgb = (h) => { const n = parseInt(h.replace("#", ""), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mixHex = (bg, fg, t) => { const a = hex2rgb(bg), b = hex2rgb(fg); return "#" + [0, 1, 2].map((i) => Math.round(a[i] + (b[i] - a[i]) * t).toString(16).padStart(2, "0")).join(""); };

function volStyle(vmax, base, surface) {
  const f = (v) => Math.sqrt(Math.max(0, Math.min(1, (v || 0) / (vmax || 1)))); // sqrt: area-like, so small hours stay visible
  const [r, g, b] = hex2rgb(surface), dark = (0.299 * r + 0.587 * g + 0.114 * b) < 128;
  const pale = mixHex(surface, base, 0.30), deep = mixHex(base, dark ? "#ffffffff".slice(0, 7) : "#000000", 0.38); // quiet = pale, busy = deep (brighter on a dark page)
  const color = (v) => { const x = f(v); return x < 0.5 ? mixHex(pale, base, x / 0.5) : mixHex(base, deep, (x - 0.5) / 0.5); };
  return { w: (v) => 1.5 + 3.5 * f(v), color }; // 1.5 to 5 px; colour carries most of the volume signal
}

/* One chart for the item page, made of stacked panels that share one time axis and one crosshair

   Every series is aligned to `ts` (null = no value).

  pat.append(sv("line", { x1: 0, y1: 0, x2: 0, y2: 7, stroke: "var(--axis)", "stroke-width": 1.2 }));
  const pat2 = sv("pattern", { id: "outrange", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(-45)" });
  pat2.append(sv("line", { x1: 0, y1: 0, x2: 0, y2: 6, stroke: "var(--sell)", "stroke-width": 1, "stroke-opacity": 0.35 }));
  defs0.append(pat, pat2); svg.append(defs0);

    if (p.vline) vals.push(...p.vline.vals.filter((v) => v != null)); // the average-trade-price line must fit in the y range too
    if (p.bars) vals.push(...p.bars.vals.filter((v) => v != null));
    const base = p.bars || p.zero;
    const hi0 = vals.length ? Math.max(...vals) : 1, dataLo = vals.length ? Math.min(...vals) : 0;

    for (const v of ticks) {
      svg.append(sv("line", { x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: "var(--grid)", "stroke-width": 1 }));
      const t = sv("text", { x: m.l - 8, y: Y(v) + 4, "text-anchor": "end", fill: "var(--muted)", "font-size": 11 }); t.textContent = fmtTick(v); svg.append(t);
    }
    svg.append(sv("line", { x1: m.l, x2: W - m.r, y1: top + ph, y2: top + ph, stroke: "var(--axis)", "stroke-width": 1 }));
    if (p.label) { const lab = sv("text", { x: m.l, y: top - 9, fill: "var(--ink-2)", "font-size": 11, "font-weight": 600 }); lab.textContent = p.label; svg.append(lab); }

      if (!r) continue;
      if (GOURMET_SKILLS.has(r.skill)) gourmet = true;
      const e = expectedOut(r), f = 1 + buffs(r.skill).artisan / 100; // artisan of this step's own skill
      for (const x of r.rows) {
        const n = x.up ? x.count : x.count / f; // expected amount: the game needs the rounded-up amount to start but keeps the unused part with the matching chance (2.7 -> 3 to start, 30% chance to keep one)
        nxt.set(x.ing, (nxt.get(x.ing) || 0) + (q * n) / e);
      }
    }
    for (const [ing, q] of nxt) out.push([d, ing, q]);
    cur = nxt;
  }
  return { rows: out, gourmet };
}
/* Crafting seconds per unit of an item (speed, efficiency and gourmet of the recipe's skill).  craftSecs holds base time / output count, so base time per craft = that x out.
   - speed: the action time is divided by 1 + speed% / 100 (Arcane Lumber: 30 s / (1 + 143.9%) = 12.3 s per action, as the game shows).
   - efficiency: each action does 1 + efficiency% crafts on average (126% -> always 2, 26% chance of a 3rd); the extra crafts are not free
     (they use ingredients as usual), so efficiency only shortens the time.  Efficiency = the Effic. % setting + 1% for each level of the skill above the
     recipe's level requirement (see effOf).
   - gourmet: a craft makes more than `out` units on average, so each unit takes less (cooking and brewing only). */
const effOf = (r) => { const b = buffs(r.skill); return b.eff + (r.lvl ? Math.max(0, b.level - r.lvl - (b.artisan > 0 ? ARTISAN_LEVEL_PENALTY : 0)) : 0); }; // % efficiency of a recipe: setting + 1% per level above its requirement (which artisan raises by 5)
const unitSecs = (item) => {
  const r = recipes.get(item);
  return r ? ((craftSecs.get(item) || 0) * r.out) / expectedOut(r) / (1 + buffs(r.skill).speed / 100) / (1 + effOf(r) / 100) : 0;
};

function costSeries(hrid) { // arrays aligned with D.snaps; null = recipe unknown or an ingredient is not on the market
  const ckey = hrid + "|" + JSON.stringify(UI.skills); // the cache key holds every skill's buffs
  if (costCache.has(ckey)) return costCache.get(ckey);
  const dr = recipes.has(hrid) ? depthRows(hrid) : { rows: [], gourmet: false }, rs = dr.rows;
  if (!rs.length) { costCache.set(ckey, null); return null; }
  const maxD = Math.max(...rs.map((r) => r[0])), cuts = [];
  for (let d = 1; d <= maxD; d++) cuts.push(rs.filter((r) => r[0] === d || (r[0] < d && !craftSet.has(r[1]))).map((r) => [r[1], r[2]]));
  const idOf = new Map([...D.items.values()].map((i) => [i.hrid, i.id])), H = new Map();
  for (const r of rs) if (!H.has(r[1])) H.set(r[1], r[1] !== COIN && idOf.has(r[1]) ? history(idOf.get(r[1]), 0) : null);
  const n = D.snaps.length, out = {};
  for (const f of ["ask", "bid"]) out[f] = { parts: new Array(n).fill(null), raw: new Array(n).fill(null) };
  for (let t = 0; t < n; t++) for (const f of ["ask", "bid"]) {
    let first = null, last = null;
    cuts.forEach((c, k) => {
      let sum = 0;
      for (const [h, q] of c) {
        let v;
        if (h === COIN) v = 1; else { const hh = H.get(h); v = hh && hh[t].v ? hh[t].v[f] : null; }
        if (v == null) { sum = null; break; }
        sum += q * v;
      }
      if (k === 0) first = sum;
      if (k === cuts.length - 1) last = sum;
    });
    out[f].parts[t] = first; out[f].raw[t] = last;
  }
  // crafting time: this item once, plus every craftable ingredient above the cut (qty per unit x its seconds per unit).  Gathering is not counted.
  const own = unitSecs(hrid);
  out.secs = craftSecs.size ? { parts: own, raw: own + rs.reduce((n, r) => n + r[2] * unitSecs(r[1]), 0) } : null;
  costCache.set(ckey, out);
  return out;
}

// The four cost lines for the item chart (null when the item has no recipe or the database has no recipe table).
function costParts(it, all, pts) {
  if (!hasRecipes()) return null;
  const cs = costSeries(it.hrid);
  if (!cs) return null;
  const off = Math.max(0, all.indexOf(pts[0])), cut = (a) => a.slice(off, off + pts.length); // pts is the selected stretch of all
  const cParts = getComputedStyle(document.documentElement).getPropertyValue("--cost1").trim(), cRaw = getComputedStyle(document.documentElement).getPropertyValue("--cost2").trim();
  const A = cs.ask, dash = "7 5", per = UI.hour / 3600; // only ask-priced costs: producing is acquiring, so it is compared with buying now
  const withTime = (arr, secs) => cut(arr).map((v) => (v == null ? null : v + (secs || 0) * per)); // time cost is the same at every snapshot
  const sp = cs.secs ? cs.secs.parts : 0, sr = cs.secs ? cs.secs.raw : 0;
  const dur = fmtDur; // crafting time, real time with speed and efficiency
  const row = (id, name, color, arr, secs) => ({ id, name, color, dash: true, vals: arr, text: (i) => (arr[i] == null ? "not priced" : full(arr[i]) + (cs.secs ? " (" + dur(secs) + ")" : "")) });
  return {
    lines: [
      { id: "c1", vals: withTime(A.parts, sp), color: cParts, dash },
      { id: "c2", vals: withTime(A.raw, sr), color: cRaw, dash },
    ],
    tip: [
      row("c1", "1 step craft (time)", cParts, withTime(A.parts, sp), sp),
      row("c2", "Full craft (time)", cRaw, withTime(A.raw, sr), sr),
    ],
    legend: [
      { id: "c1", swatch: el("span", { class: "key dashed", style: "--k:" + cParts }), label: "1 step craft" },
      { id: "c2", swatch: el("span", { class: "key dashed", style: "--k:" + cRaw }), label: "Full craft" },
    ],
  };
}

function openItem(iid, lvl) { UI.item = iid; UI.itemLevel = lvl ?? 0; setTab("item"); }

// ------------------------------------------------------------------ watchlist
function toggleWatch(key) { UI.watch.has(key) ? UI.watch.delete(key) : UI.watch.add(key); saveWatch(); }

function spark(pts, color, w = 200, h = 44) {
  const v = pts.filter((p) => p != null);
  const svg = sv("svg", { viewBox: `0 0 ${w} ${h}`, width: "100%", role: "img", "aria-label": "price trend" });
  if (v.length < 2) return svg;
  const lo = Math.min(...v), hi = Math.max(...v), n = pts.length;
  const X = (i) => 4 + (i / (n - 1)) * (w - 8), Y = (x) => h - 6 - ((x - lo) / (hi - lo || 1)) * (h - 12);
  let d = "", pen = false;
  pts.forEach((x, i) => { if (x == null) { pen = false; return; } d += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(x).toFixed(1) + " "; pen = true; });
  svg.append(sv("path", { d, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  const li = pts.length - 1 - [...pts].reverse().findIndex((x) => x != null);
  svg.append(sv("circle", { cx: X(li), cy: Y(pts[li]), r: 4, fill: color, stroke: "var(--surface)", "stroke-width": 2 }));
  return svg;
}

function renderWatch() {
  const body = $("watch-body"); body.replaceChildren();
  const keys = [...UI.watch];
  if (!keys.length) { body.append(el("div", { class: "empty", text: "Nothing on your watchlist yet. Click ☆ next to an item in Movers, or press “Watch” on an item page." })); return; }
  const t = pickThen(UI.windowId);
  if (t.note) body.append(el("p", { class: "note", text: t.note }));
  const cssv = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const grid = el("div", { class: "cards" });
  const cutoff = D.latest.ts - 7 * 86400;
  for (const key of keys) {
    const [iid, lvl] = key.split("|").map(Number), it = D.items.get(iid);
    if (!it) continue;
    const all = history(iid, lvl), now = all[all.length - 1].v, then = t.snap ? all.find((p) => p.ts === t.snap.ts)?.v : null;
    const spk = all.filter((p) => p.ts >= cutoff).map((p) => (p.v ? p.v.bid : null));
    const nm = el("button", { class: "nm", text: it.name + (lvl ? " +" + lvl : "") }); nm.addEventListener("click", () => openItem(iid, lvl));
    const rm = el("button", { class: "btn", text: "Remove", "aria-label": "Remove " + it.name }); rm.addEventListener("click", () => { toggleWatch(key); renderWatch(); });
    const delta = now && then ? deltaNode(pct(now.bid, then.bid)) : "";
    grid.append(el("div", { class: "wcard" },
      el("div", { class: "top" }, nm, delta),
      el("div", { class: "big", text: now ? full(now.bid) : "not listed" }),
      el("div", { class: "sub", text: now ? `ask ${full(now.ask)} · volume ${full(now.volume)}` : "" }),
      spark(spk, cssv("--s1")),
      el("div", { class: "sub", style: "display:flex;justify-content:space-between;align-items:center" }, el("span", { text: "bid, last 7 days" }), rm)));
  }
  body.append(grid);
}

// ------------------------------------------------------------------ tabs, filters, loading
function setTab(tab) {
  UI.tab = tab;
  for (const t of ["movers", "item", "craft", "trade", "watch", "settings"]) {
    $("tab-" + t).setAttribute("aria-selected", String(t === tab));
    $("p-" + t).classList.toggle("hidden", t !== tab);
  }
  $("f-minvol-l").classList.toggle("hidden", tab !== "movers"); $("f-search-l").classList.toggle("hidden", tab !== "movers");
  $("f-dir-l").classList.toggle("hidden", tab !== "movers"); $("f-window").parentElement.classList.toggle("hidden", tab === "item"); $("f-level").parentElement.classList.toggle("hidden", tab !== "movers");
  $("filters").classList.toggle("hidden", tab === "item" || tab === "craft" || tab === "trade" || tab === "settings");
  $("windownote").replaceChildren();
  render();
}
function render() {
  if (!db) return;
  if (UI.tab === "movers") renderMovers(); else if (UI.tab === "item") { renderItem(); $("windownote").replaceChildren(); } else if (UI.tab === "craft") renderCraft(); else if (UI.tab === "trade") renderTrade(); else if (UI.tab === "settings") syncSkillBoxes(); else renderWatch();
}

function afterLoad() {
  $("load").classList.add("hidden"); $("app").classList.remove("hidden");
  const age = Math.round(Date.now() / 1000 - D.latest.ts);
  $("meta").textContent = `${D.snaps.length} snapshot${D.snaps.length === 1 ? "" : "s"} · ${D.items.size} items · latest ${when(D.latest.ts)} (${ago(age)} ago) · first ${when(D.snaps[0].ts)}`;
  const lv = $("f-level"); lv.replaceChildren(...D.levels.map((l) => el("option", { value: l, text: "+" + l })));
  lv.value = String(UI.level);
  fillDrinkLists(); syncSkillBoxes();
  $("itemlist").replaceChildren(...[...D.byName.keys()].sort().map((n) => el("option", { value: n })));
  $("f-window").value = UI.windowId; $("f-minvol").value = UI.minvol;
  UI.item = null;
  setTab("movers");
}

async function loadBytes(buf, name) {
  try {
    let bytes = buf;
    const head = new Uint8Array(buf.slice(0, 2));
    if (head[0] === 0x1f && head[1] === 0x8b) { // gzip
      bytes = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
    }
    await openDb(bytes); afterLoad(); $("loaderr").textContent = "";
  } catch (e) {
    $("load").classList.remove("hidden"); $("app").classList.add("hidden");
    $("loaderr").textContent = "Could not read " + (name || "the file") + ": " + e.message;
  }
}

$("open").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", async (e) => { const f = e.target.files[0]; if (f) loadBytes(await f.arrayBuffer(), f.name); });
const dz = $("load");
dz.addEventListener("dragover", (e) => { e.preventDefault(); dz.classList.add("over"); });
dz.addEventListener("dragleave", () => dz.classList.remove("over"));
dz.addEventListener("drop", async (e) => { e.preventDefault(); dz.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) loadBytes(await f.arrayBuffer(), f.name); });
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", async (e) => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) loadBytes(await f.arrayBuffer(), f.name); });

for (const t of ["movers", "item", "craft", "trade", "watch", "settings"]) $("tab-" + t).addEventListener("click", () => setTab(t));
buildSettings(); // after everything above is defined
$("f-window").addEventListener("change", (e) => { UI.windowId = e.target.value; store.set("mw.window", UI.windowId); render(); });
$("f-level").addEventListener("change", (e) => { UI.level = +e.target.value; UI.limit = 250; render(); });
$("f-minvol").addEventListener("input", (e) => { UI.minvol = Math.max(0, +e.target.value || 0); store.set("mw.minvol", UI.minvol); UI.limit = 250; render(); });
$("f-search").addEventListener("input", (e) => { UI.search = e.target.value.trim(); UI.limit = 250; render(); });
for (const b of $("f-dir-l").querySelectorAll("button")) b.addEventListener("click", () => {
  UI.dir = b.dataset.dir; UI.limit = 250;
  for (const x of $("f-dir-l").querySelectorAll("button")) x.setAttribute("aria-pressed", String(x === b));
  render();
});
const pickItem = (e) => { const it = D.byName.get(e.target.value); if (it && (it.id !== UI.item || e.type === "change")) { UI.item = it.id; UI.itemLevel = 0; renderItem(); } };
$("i-search").addEventListener("change", pickItem);
$("i-search").addEventListener("input", pickItem); // Firefox fires "change" on a datalist pick only when the field loses focus
$("i-level").addEventListener("change", (e) => { UI.itemLevel = +e.target.value; renderItem(); });
$("i-star").addEventListener("click", () => { if (UI.item == null) return; toggleWatch(UI.item + "|" + UI.itemLevel); renderItem(); });
$("i-hour").addEventListener("input", (e) => { const v = parseFloat(e.target.value); UI.hour = v >= 0 ? v * 1e6 : 0; renderItem(); });
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (UI.tab === "item") renderItem(); }, 150); });

// theme toggle: auto -> light -> dark
const themes = ["auto", "light", "dark"];
function applyTheme(t) {
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  $("theme").textContent = "Theme: " + t; store.set("mw.theme", t); render();
}
$("theme").addEventListener("click", () => applyTheme(themes[(themes.indexOf(store.get("mw.theme", "auto")) + 1) % 3]));
applyTheme(store.get("mw.theme", "auto"));

// auto-load when served over http next to the database
(async () => {
  if (!location.protocol.startsWith("http")) return;
  for (const name of ["market.db.gz", "market.db"]) {
    try { const r = await fetch(name, { cache: "no-store" }); if (r.ok) { await loadBytes(await r.arrayBuffer(), name); return; } } catch (e) { /* try next */ }
  }
})();
</script>
